{% extends "base.html" %}

{% block content %}
<div class="container fade-in" style="max-width: 800px;">
    <h2 class="fw-bold mb-4">{% if object %}Sửa{% else %}Thêm{% endif %} nhóm sản phẩm</h2>
    <div class="glass-card">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Mã nhóm *</label>
                {{ form.group_code }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Tên nhóm *</label>
                {{ form.group_name }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Mô tả</label>
                {{ form.description }}
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'productgroup_list' %}" class="btn btn-light">Hủy</a>
                <button type="submit" class="btn btn-primary">Lưu</button>
            </div>
        </form>
    </div>
</div>
<script>
    document.querySelectorAll('input, textarea').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
