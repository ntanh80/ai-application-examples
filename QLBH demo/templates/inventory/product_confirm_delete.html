{% extends "base.html" %}

{% block content %}
<div class="container fade-in" style="max-width: 500px; margin-top: 5rem;">
    <div class="glass-card text-center">
        <i class="bi bi-exclamation-octagon text-danger display-4 mb-3"></i>
        <h3 class="fw-bold">Xác nhận xóa sản phẩm</h3>
        <p class="text-secondary">Bạn có chắc chắn muốn xóa <strong>{{ object.product_name }}</strong>? Thao tác này không thể phục hồi.</p>
        
        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger py-2">Xác nhận xóa</button>
                <a href="{% url 'product_list' %}" class="btn btn-light py-2">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
