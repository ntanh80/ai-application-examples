<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SkyGate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }
        label { color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px; }
        .btn-primary {
            background: #0284c7;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        .btn-primary:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="text-white fw-bold mb-2">SkyGate</h2>
        <p class="text-secondary small mb-4">Vui lòng đăng nhập để tiếp tục</p>
        
        {% if form.errors %}
            <div class="alert alert-danger py-2 small border-0" style="background: rgba(220, 38, 38, 0.15); color: #fca5a5;">
                Tên đăng nhập hoặc mật khẩu không đúng.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label for="id_username">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus>
            </div>
            <div class="mb-4 text-start">
                <label for="id_password">Mật khẩu</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Đăng nhập</button>
        </form>
        
        <div class="mt-3 text-secondary small">
            Quên mật khẩu? Liên hệ quản trị viên.
        </div>
    </div>
</body>
</html>
